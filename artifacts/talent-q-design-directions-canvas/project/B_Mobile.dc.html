<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger — J7 Career home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#7a5a17}a:hover{color:#4f3a0e}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f3ec; color: #16140f; font-family: Geist, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; padding: 24px 20px 16px; gap: 22px; overflow: hidden">
  <header style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid #16140f; padding-bottom: 12px">
    <span style="font-family: Newsreader, Georgia, serif; font-size: 22px">Talent <span style="color: #9a7220">Q</span></span>
    <a href="#" style="font-size: 15px; min-height: 44px; display: flex; align-items: center">Menu</a>
  </header>

  <section aria-labelledby="j7b" style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #7a5a17">PATH · PRODUCT ANALYST</span>
    <h1 id="j7b" style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.12">Two gaps stand between you and applying.</h1>
  </section>

  <dl style="margin: 0; display: flex; flex-direction: column; border-top: 1px solid #16140f">
    <sc-for list="{{measures}}" as="m" hint-placeholder-count="4">
      <div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #d8d1c2">
        <dt style="color: #4d473c; font-size: 15px">{{m.label}}</dt>
        <dd style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 20px">{{m.value}}</dd>
      </div>
    </sc-for>
  </dl>

  <section aria-labelledby="gb" style="display: flex; flex-direction: column; gap: 12px">
    <h2 id="gb" style="margin: 0; font-family: 'Geist Mono', monospace; font-weight: 500; font-size: 12px; letter-spacing: 0.08em">NEXT GAP</h2>
    <p style="margin: 0"><strong style="font-weight: 600">SQL window functions</strong> — not yet evidenced. A 40-minute task lets you show it.</p>
    <button type="button" style="min-height: 48px; border-radius: 4px; border: 0; background: #16140f; color: #f6f3ec; font-weight: 600">Start practice</button>
  </section>

  <form style="margin-top: auto; display: flex; gap: 8px; align-items: center; border-top: 1px solid #16140f; padding-top: 10px">
    <label for="ask-bm" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask Q</label>
    <input id="ask-bm" type="text" placeholder="Ask Q about your path" style="flex: 1 1 auto; min-width: 0; background: transparent; border: 0; color: #16140f; font: inherit; outline: none">
    <button type="button" aria-label="Speak to Q" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #16140f; background: transparent; color: #16140f; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
    </button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      measures: [
        { label: 'Evidence coverage', value: '6 of 9' },
        { label: 'Readiness to apply', value: 'Close' },
        { label: 'Practice this week', value: '3 tasks' },
        { label: 'Role fit', value: 'Strong' }
      ]
    };
  }
}
</script>
</body>
</html>
