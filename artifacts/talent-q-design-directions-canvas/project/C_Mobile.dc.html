<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atelier — J7 Career home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#7a5a17}a:hover{color:#4f3a0e}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b0a08; color: #ece6da; font-family: Geist, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: Newsreader, Georgia, serif; font-size: 20px">Talent Q</span>
      <a href="#" style="color: #d9b56b; font-size: 14px; min-height: 44px; display: flex; align-items: center">History</a>
    </header>
    <div style="display: flex; gap: 12px">
      <span aria-hidden="true" style="flex: none; width: 3px; border-radius: 2px; background: {{gold}}"></span>
      <h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 22px; line-height: 1.35">Two gaps stand between you and applying for Product Analyst. I’ve laid out your path.</h1>
    </div>
  </div>

  <section aria-labelledby="path-c" style="flex: 1 1 auto; background: #f6f3ec; color: #16140f; border-radius: 20px 20px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 id="path-c" style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 24px">Your path</h2>
      <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5c5548">6 OF 9 EVIDENCED</span>
    </div>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
        <li style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #ddd5c4">
          <span aria-hidden="true" style="flex: none; margin-top: 6px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #16140f; background: {{s.fill}}"></span>
          <div style="display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0">
            <span style="font-weight: 500">{{s.label}}</span>
            <span style="font-size: 13px; color: #4d473c">{{s.state}}</span>
          </div>
        </li>
      </sc-for>
    </ol>
    <button type="button" style="margin-top: auto; min-height: 48px; border-radius: 12px; border: 0; background: #16140f; color: #f6f3ec; font-weight: 600">Practise SQL window functions</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"gold":{"editor":"color","default":"#d9b56b","options":["#d9b56b","#c9a24f","#e3c27d"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      gold: this.props.gold ?? '#d9b56b',
      steps: [
        { label: 'Spreadsheet modelling', state: 'Verified capability', fill: '#16140f' },
        { label: 'Dashboard storytelling', state: 'Evidenced · 2 artifacts', fill: '#16140f' },
        { label: 'SQL window functions', state: 'Not evidenced · next', fill: '#f6f3ec' },
        { label: 'Stakeholder writing', state: 'Evidence outdated', fill: '#f6f3ec' },
        { label: 'Experiment design', state: 'Requirement unclear', fill: '#f6f3ec' }
      ]
    };
  }
}
</script>
</body>
</html>
